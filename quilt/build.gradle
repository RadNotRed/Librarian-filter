plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "Easy Villager Trade Reroll - Quilt - ${project.minecraft_version}"
}

repositories {
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release/'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"quick-craft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation project(":common")
	clientImplementation project(":common")

	// Direct compile deps (not using modImplementation to avoid Loom ordering issues)
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	clientImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	clientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching(["quilt.mod.json", "fabric.mod.json"]) {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(project(":common").sourceSets.main.output)

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}

	exclude "fabric.mod.json"
}

tasks.withType(Jar).configureEach {
	archiveFileName = archiveFileName.get().replace("--", "- ")
}
